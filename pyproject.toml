[project]
name = "westbusan-accommodation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pyarrow>=20,<24",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyproj>=3.7,<4",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.14,<4",
  "shapely>=2.1,<3",
  "tenacity>=9.1,<10",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
  "xlrd>=2.0,<3",
  "xmltodict>=0.14,<1",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "pytz>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
westbusan = "westbusan.cli:app"

[tool.setuptools.package-data]
"westbusan.spatial" = ["templates/*.html", "assets/*.css", "assets/*.js"]
"westbusan.tourism_dashboard" = ["assets/*"]
"westbusan.vacant_house" = ["templates/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: opt-in checks that may contact live external sources"]

[tool.ruff]
line-length = 88
target-version = "py311"
