sources:
  # Legal accommodation registrations.  Tourist-pension designations are attributes,
  # never additional physical facilities.
  - source_id: lodgings
    url: https://apis.data.go.kr/1741000/lodgings
    operation: info
    group: accommodation
    required_for_publication: true
    cadence: daily
    page_size: 1000
    format_parameter: returnType
    format_value: json
    response_row_path: data
    required_parameters: {"cond[OPN_ATMY_GRP_CD::EQ]": "6260000"}
    temporal_semantics: current_snapshot_only
  - source_id: tourist_accommodations
    url: https://apis.data.go.kr/1741000/tourist_accommodations
