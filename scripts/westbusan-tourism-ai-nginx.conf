# The rate zone belongs in the nginx http context, for example
# /etc/nginx/conf.d/westbusan-tourism-ai-rate.conf:
# limit_req_zone $binary_remote_addr zone=tourism_ai:1m rate=6r/m;

location = /tourism/api/insights {
    limit_except POST { deny all; }
    limit_req zone=tourism_ai burst=2 nodelay;
    client_max_body_size 2k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_pass http://127.0.0.1:18081/insights;
}

